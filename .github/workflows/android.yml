name: Android Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Test and assemble unsigned APKs
        run: |
          ./gradlew --no-daemon --stacktrace -PtallyUnsignedCiBuild=true \
            :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleRelease \
            :payment-demo:assembleRelease

      - name: Record APK metadata and checksums
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Tally-unsigned.apk
          cp payment-demo/build/outputs/apk/release/payment-demo-release-unsigned.apk dist/Tally-Payment-Demo-unsigned.apk
          cd dist
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
          sha256sum ./*.apk > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Tally-unsigned.apk | sed -n '1p' > APK_METADATA.txt

      - name: Upload unsigned build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tally-android-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
